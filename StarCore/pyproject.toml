# Python frontend of the StarCore engine (the `starcore` package).
#
#   uv venv && uv pip install -e "StarCore[test]"   # from the repository root
#   uv run pytest StarCore/python/tests
#
# scikit-build-core drives StarCore/CMakeLists.txt with the runtime (window/Vulkan), the C++ tests
# and the examples turned off; vcpkg is found through $VCPKG_ROOT.

[build-system]
requires = ["scikit-build-core>=0.11", "nanobind>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "starcore"
dynamic = ["version"]
description = "StarCore render engine: scene/ECS, glTF assets, CPU path tracer, 2D raster, physics"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/starcore"]
# One abi3 wheel for CPython >= 3.12 (nanobind STABLE_ABI).
wheel.py-api = "cp312"
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
STARCORE_BUILD_PYTHON = "ON"
STARCORE_BUILD_GPU = "OFF"
STARCORE_BUILD_RUNTIME = "OFF"
STARCORE_BUILD_TESTS = "OFF"
STARCORE_BUILD_EXAMPLES = "OFF"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\(\s*StarCore\s+VERSION\s+(?P<value>[0-9.]+)'

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = ["-ra"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]
